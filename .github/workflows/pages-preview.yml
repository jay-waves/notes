name: Build and deploy notes

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy a successful build to Cloudflare Pages
        type: boolean
        default: true
      full_build:
        description: Recompile every document (including after resource changes)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_CACHE_DIR: .site-cache
    steps:
      - name: Checkout notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout assets
        uses: actions/checkout@v6
        with:
          ref: assets
          path: attach/tmp
      - name: Set up ypst
        uses: jay-waves/ypst@main
      - name: Set up cmrak
        uses: jay-waves/cmrak@main
      - name: Install related notes dependency
        run: python3 -m pip install -r .github/scripts/requirements-related.txt
      - name: Restore compiled pages
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SITE_CACHE_DIR }}
          key: notes-pages-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notes-pages-v1-${{ runner.os }}-
      - name: Build site
        run: python3 .github/scripts/build_site.py ${{ inputs.full_build && '--full' || '' }}
      - name: Check generated URLs
        run: python3 .github/scripts/check_site.py _site
      - name: Save compiled pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SITE_CACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.PAGES }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: pages-preview
          path: _site
      - name: Deploy to Cloudflare Pages
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          npx --yes wrangler@4 pages deploy _site --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
      - name: Remove old production deployments
        run: python3 .github/scripts/prune_deployments.py
