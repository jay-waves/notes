name: Build Pages preview

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy a successful build to Cloudflare Pages
        type: boolean
        default: true
      full_build:
        description: Recompile every document (including after resource changes)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Warn about missing source paths
        run: python3 .github/scripts/warn_missing_paths.py
        continue-on-error: true
      - name: Checkout Typst template
        uses: actions/checkout@v6
        with:
          repository: jay-waves/ypst-template
          path: .github/.ypst-template
          persist-credentials: false
      - name: Record Typst template commit
        run: |
          template_sha=$(git -C .github/.ypst-template rev-parse HEAD)
          echo "TEMPLATE_COMMIT=$template_sha" >> "$GITHUB_ENV"
          echo "Typst template commit: $template_sha"
      - name: Set up Typst template
        uses: ./.github/.ypst-template
      - name: Download lib.comrak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/jay-waves/lib.ts/releases/latest > "$RUNNER_TEMP/comrak-release.json"
          tag=$(jq -er '.tag_name' "$RUNNER_TEMP/comrak-release.json")
          asset=$(jq -er '[.assets[] | select(.name | test("^lib\\.comrak.*linux-x86_64\\.tar\\.xz$"))] | if length == 1 then .[0].name else error("expected exactly one Linux lib.comrak asset") end' "$RUNNER_TEMP/comrak-release.json")
          digest=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | select(startswith("sha256:")) | ltrimstr("sha256:")' "$RUNNER_TEMP/comrak-release.json")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          gh release download "$tag" --repo jay-waves/lib.ts --pattern "$asset" --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          echo "lib.comrak release: $tag, asset SHA-256: $digest"
          mkdir "$RUNNER_TEMP/comrak"
          tar -xJf "$archive" -C "$RUNNER_TEMP/comrak"
          executable=$(find "$RUNNER_TEMP/comrak" -type f -name lib.comrak -print)
          test -n "$executable"
          test "$(printf '%s\n' "$executable" | wc -l)" -eq 1
          chmod +x "$executable"
          echo "COMRAK_PATH=$executable" >> "$GITHUB_ENV"
          "$executable" --help
      - name: Install related notes dependency
        run: python3 -m pip install -r .github/scripts/requirements-related.txt
      - name: Test build scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Restore compiled pages
        uses: actions/cache/restore@v4
        with:
          path: .site-cache
          key: notes-pages-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notes-pages-v1-${{ runner.os }}-
      - name: Build site
        env:
          FULL_BUILD: ${{ inputs.full_build }}
        run: |
          full=()
          if [[ "$FULL_BUILD" == "true" ]]; then full+=(--full); fi
          python3 .github/scripts/build_site.py \
            --comrak "$COMRAK_PATH" \
            --typst-wrapper .github/.ypst-template/typst.py \
            --typst-font-path .github/.ypst-template/fonts \
            --report "$RUNNER_TEMP/site-build-report.json" \
            --cache-dir .site-cache "${full[@]}"
      - name: Summarize skipped documents
        run: |
          python3 - "$RUNNER_TEMP/site-build-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## Site build")
          print(f"Published: {report['published']} · Reused: {report.get('reused', 0)} · Skipped: {len(report['failed'])}")
          for item in report["failed"]:
              name = item["source"].replace("|", "\\|").replace("\n", " ")
              print(f"- `{name}`: {item['reason']}")
          print("\n### Slowest documents")
          for item in sorted(report.get("durations", []), key=lambda item: item["seconds"], reverse=True)[:10]:
              name = item["source"].replace("\n", " ")
              print(f"- `{name}`: {item['seconds']:.2f}s")
          PY
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: site-build-report
          path: ${{ runner.temp }}/site-build-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Check generated URLs
        run: python3 .github/scripts/check_site.py _site
      - name: Save compiled pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .site-cache
          key: notes-pages-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: pages-preview
          path: _site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PAGES }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          npx --yes wrangler@4 pages deploy _site --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
      - name: Remove old production deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PAGES }}
        run: python3 .github/scripts/prune_deployments.py
