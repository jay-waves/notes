name: Deploy existing Pages build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Build Pages preview run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    timeout-minutes: 15
    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion,headBranch,event \
            | jq -e '.workflowName == "Build Pages preview" and .status == "completed" and .conclusion == "success" and .headBranch == "main" and .event != "pull_request"'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name pages-preview --dir _site
          test -f _site/index.html
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.PAGES }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          npx --yes wrangler@4 pages deploy _site --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
