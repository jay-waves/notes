<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Notes</title><link rel="stylesheet" href="_shared/site/theme.css"></head>
<body><main><header><h1>Notes</h1><p>A collection of notes · <!-- COUNT --> files</p><label for="search">Search files</label><input id="search" type="search" placeholder="Search by name or path" autocomplete="off"></header><div id="entries"><!-- CONTENT --></div><p id="empty" class="muted" hidden>No matching files.</p></main>
<script>const search=document.querySelector('#search'),sections=[...document.querySelectorAll('#entries section')],empty=document.querySelector('#empty');search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let count=0;for(const section of sections){let visible=0;for(const row of section.querySelectorAll('li')){row.hidden=!row.dataset.search.toLowerCase().includes(q);if(!row.hidden)visible++}section.hidden=!visible;count+=visible}empty.hidden=count>0});</script></body></html>
